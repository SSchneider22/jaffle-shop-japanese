models:
  - name: customers
    description: 顧客概要データマート。各ユニーク顧客の主要な詳細情報を提供します。顧客ごとに1行。
    data_tests:
      - dbt_utils.expression_is_true:
          expression: "lifetime_spend_pretax + lifetime_tax_paid = lifetime_spend"
    columns:
      - name: customer_id
        description: 注文マートのユニークキー。
        data_tests:
          - not_null
          - unique
      - name: customer_name
        description: 顧客のフルネーム。
      - name: count_lifetime_orders
        description: Total number of orders a customer has ever placed.
      - name: first_ordered_at
        description: 顧客が最初の注文を行ったタイムスタンプ。
      - name: last_ordered_at
        description: 顧客の最新注文のタイムスタンプ。
      - name: lifetime_spend_pretax
        description: 顧客が行ったすべての注文の税抜小計の合計。
      - name: lifetime_tax_paid
        description: 顧客が行ったすべての注文の税額部分の合計。
      - name: lifetime_spend
        label: 
        description: 顧客がこれまでに行ったすべての注文合計（税込）の合計。
      - name: customer_type
        description: 「new」または「returning」のいずれか。顧客が複数回注文しているか、現在までに初回注文のみを行っているかを示します。
        data_tests:
          - accepted_values:
              values: ["new", "returning"]

semantic_models:
  - name: customers
    defaults:
      agg_time_dimension: first_ordered_at
    description: |
      Customer grain mart.
    model: ref('customers')
    entities:
      - name: customer
        expr: customer_id
        type: primary
    dimensions:
      - name: customer_name
        type: categorical
        label: 顧客名
        description: 顧客のフルネーム
      - name: customer_type
        type: categorical
        label: 顧客タイプ
        description: オプションはnewまたはreturningであり、顧客が複数回注文したことがあるか、または今日初めて注文したかを示します。
      - name: first_ordered_at
        type: time
        label: 初回注文日
        description: 顧客の最初の注文日
        type_params:
          time_granularity: day
      - name: last_ordered_at
        type: time
        label: 最終注文日
        description: 顧客の最後の注文日
        type_params:
          time_granularity: day
    measures:
      - name: customers
        description: Customerの合計
        agg: count_distinct
      - name: count_lifetime_orders
        description: 顧客ごとの合計注文数
        agg: sum
      - name: lifetime_spend_pretax
        description: 顧客の税を含まない合計購入額
        agg: sum
      - name: lifetime_spend
        agg: sum
        description: 顧客の税を含む合計購入額

metrics:
  - name: lifetime_spend_pretax
    description: 顧客の税を含まない合計購入額
    label: 合計購入額(税抜き)
    type: simple
    type_params:
      measure: lifetime_spend_pretax
  - name: count_lifetime_orders
    description: Count of lifetime orders
    label: 合計注文回数
    type: simple
    type_params:
      measure: count_lifetime_orders
  - name: average_order_value
    description: LTV pre-tax / number of orders
    label: 平均注文金額
    type: derived
    type_params:
      metrics:
        - count_lifetime_orders
        - lifetime_spend_pretax
      expr: lifetime_spend_pretax / count_lifetime_orders * 1.0

saved_queries:
  - name: customer_order_metrics
    query_params:
      metrics:
        - count_lifetime_orders
        - lifetime_spend_pretax
        - average_order_value
      group_by:
        - Entity('customer')
    exports:
      - name: customer_order_metrics
        config:
          export_as: table
